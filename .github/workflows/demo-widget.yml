# Builds the public demo widget on every change to main that can affect it and publishes the
# result as the assets of one rolling GitHub release, `demo-widget-latest`. The marketing site
# (tdavidson/content) downloads those assets at build time, so a change to the command
# palette or the Analyst reaches www.hemrock.com/demo on the site's next deploy with no copy
# step in between. See demo-widget/README.md.
name: demo-widget

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'demo-widget/**'
      - 'app/globals.css'
      - 'tailwind.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/demo-widget.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-widget
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run demo:widget
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      # Every page of the widget, rendered on the snapshot in a real browser: a component that
      # no longer renders on this data stops the publish here rather than breaking the site.
      # Unanswered API requests are listed but do not fail the build; scripts/demo-record.mjs
      # (run locally, with the demo viewer's sign-in) is what answers them.
      - run: npm run demo:check
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - name: Move the rolling tag to this commit
        run: |
          git tag -f demo-widget-latest
          git push -f origin demo-widget-latest
      # Chunk names carry a content hash, so every build uploads new names and the publish step
      # only replaces assets whose name it uploads again. Without this the old chunks pile up
      # until the release hits GitHub's 1,000-asset cap and every publish fails. Anything not in
      # this build's dist/ is no longer referenced by the widget.js being published.
      - name: Remove assets from earlier builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/demo-widget-latest" --jq .id 2>/dev/null || true)
          if [ -z "$release_id" ]; then echo "No release yet"; exit 0; fi
          ls demo-widget/dist > /tmp/keep.txt
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            --jq '.[] | "\(.id) \(.name)"' |
          while read -r id name; do
            if ! grep -qxF "$name" /tmp/keep.txt; then
              echo "Deleting stale asset $name"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}"
            fi
          done
      - name: Publish the assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demo-widget-latest
          name: Demo widget (latest)
          prerelease: true
          body: |
            The public demo widget, rebuilt from `main` on every relevant change. Consumed by the
            marketing site's build; not a release of the application.
          files: demo-widget/dist/*
