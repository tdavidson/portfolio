# Creates the GitHub release when a version tag (v1.2.3) is pushed. The body comes from that
# version's CHANGELOG.md section (scripts/release-notes.mjs), with every migration added since the
# previous tag listed first, so a self-hosted install knows what to apply before it deploys.
#
# To cut a release: rename "## Unreleased" in CHANGELOG.md to "## 1.2.3 — <date>", bump
# package.json, merge, then `git tag v1.2.3 && git push origin v1.2.3`.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Write the release notes
        run: |
          previous=$(git tag --list 'v*.*.*' --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -n1)
          if [ -n "$previous" ]; then
            node scripts/release-notes.mjs "$GITHUB_REF_NAME" --since "$previous" > release-notes.md
          else
            node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
